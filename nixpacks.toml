# NOTE: Railway builds this service with the checked-in Dockerfile (see
# railway.json "builder": "DOCKERFILE"), so this file is only a reference for
# local/tooling builds. It intentionally declares NO secrets: API keys
# (AI_API_KEY, SEARCH_API_KEY, ...) are never listed here and never appear as
# ARG/ENV in any image; they are read from process.env at server runtime only.

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node scripts/ensure-runtime-data.mjs && npm start"
